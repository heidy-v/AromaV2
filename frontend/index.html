<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Document</title>
</head>
<body>

<!-- Barra de navegacion -->
<nav class="navbar" >
<img  class="logo" src="img/logo.svg" >
 <h1>Aroma</h1>
    <ul class="link">
        <li><a href="#" class="nav-link" data-view="home">Inicio</a></li>
        <li><a href="#" class="nav-link" data-view="menu">Menu</a></li>
        <li><a href="#" class="nav-link" data-view="cart">Carrito (<span id="cart-count">0</span>)</a></li>
        <li><a href="#" class="nav-link" data-view="contact">Contacto</a></li>
    </ul>
</nav>

<main>
<!-- inicio -->
    <section id="view-home" class="view active">
        <h2>Inicio</h2>
        <p>Bienvenido a la cafeteria </p>
    </section>
<!-- menu -->
    <section id="view-menu" class="view">
        <h2>Menu</h2>
        <p>Nuestros Productos Disponibles.</p>

        <div id="products-container" class="products-container">
      
        </div>

    </section>

    <!-- carrito -->
     <section id="view-cart" class="view">
        <h2>Carrito</h2>
        <p>Productos agregados</p>

        <div id="cart-container"></div>
    </section>

    <!-- Contacto -->
    <section id="view-contact" class="view">
        <div class="seccion-header">
        <h2>Contacto</h2>
        <p>Escribenos y te responderemos pronto.</p>
        </div>

        <form novalidate id="contact-form" class="contact-form">
            <div  class="form-group">
            <label for="contact-name">Nombre Completo</label>
            <input type="text" id="contact-name" placeholder="Ej. Juan Perez">
            <small class="error-msg" id="error-name"></small>
            </div>
            <div class="form-group">
            <label for="contact-email">Correo Electronico</label>
            <input type="email" id="contact-email" placeholder="Ej. juanPerez@gmail.com">
            <small class="error-msg" id="error-email"></small>
            </div>
            <div class="form-group">
            <label for="contact-message">Mensaje</label>
            <textarea name="" id="contact-message" rows="4" placeholder="En que podemos ayudarte."></textarea>
            <small class="error-msg" id="error-message"></small>
            </div>
            <button type="submit" class="btn-checkout">Enviar mensaje</button>
            <p id="form-success" class="success-msg"></p>
        </form>

    </section>

</main>

<footer>
    <p>© 2026 Cafeteria Aroma. Todos los derechos reservados.</p>
</footer>
<script src="js/app.js"></script>

</body>
</html>
